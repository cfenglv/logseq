name: Build-Selfhost6-Candidate

on:
  workflow_dispatch:
    inputs:
      source-full-sha:
        description: Exact reviewed source commit
        required: true
      target-version:
        description: Candidate identity
        type: choice
        required: true
        options:
          - 2.0.1-selfhost.7
          - 2.0.1-selfhost.8

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  JAVA_VERSION: '21'
  CLOJURE_VERSION: '1.12.4.1618'
  OCAML_VERSION: '5.4.0'
  OPAM_VERSION: '2.5.2'
  OPAM_X86_64_LINUX_SHA512: '508a128cec8ddf06e763db56232818481a4eee7725fb725c08f543b4aefa0daa23042ec89a4dcb4fe8eac99c53c219196c715eec46b4f1f6769b47782f79943a'

jobs:
  compile-static:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-full-sha }}
      - name: Bind exact source and candidate version
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.source-full-sha }}"
          node scripts/selfhost6/set-candidate-version.mjs --version "${{ inputs.target-version }}"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}
      - name: Install pinned opam and OCaml
        shell: bash
        run: |
          opam_dir="$RUNNER_TEMP/selfhost6-opam"
          opam_bin="$opam_dir/opam"
          mkdir -p "$opam_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/ocaml/opam/releases/download/${OPAM_VERSION}/opam-${OPAM_VERSION}-x86_64-linux" \
            --output "$opam_bin"
          echo "${OPAM_X86_64_LINUX_SHA512}  ${opam_bin}" | sha512sum --check --strict
          chmod +x "$opam_bin"
          echo "$opam_dir" >> "$GITHUB_PATH"
          "$opam_bin" init --bare --disable-sandboxing --yes \
            default git+https://github.com/ocaml/opam-repository.git
          "$opam_bin" switch create . "ocaml-base-compiler.${OCAML_VERSION}" --yes
      - name: Build the existing desktop owners
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir cli install --frozen-lockfile --ignore-workspace
          opam install ./cli --deps-only --with-test --yes
          pnpm exec gulp build
          pnpm cljs:release-electron
          pnpm db-worker-node:bundle
          opam exec -- pnpm cli:release
          pnpm webpack-app-build
          pnpm desktop:prepare-runtime-js
          node -e 'const fs=require("fs"); const p="static/package.json"; const x=JSON.parse(fs.readFileSync(p)); x.version=process.env.TARGET_VERSION; fs.writeFileSync(p, JSON.stringify(x,null,2)+"\n")'
        env:
          TARGET_VERSION: ${{ inputs.target-version }}
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost6-static-${{ inputs.target-version }}
          path: static
          include-hidden-files: true

  build-platform:
    needs: compile-static
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - id: darwin-arm64
            runner: macos-14
            platform: darwin
            arch: arm64
          - id: win32-x64
            runner: windows-latest
            platform: win32
            arch: x64
          - id: win32-arm64
            runner: windows-11-arm
            platform: win32
            arch: arm64
          - id: linux-x64
            runner: ubuntu-22.04
            platform: linux
            arch: x64
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-full-sha }}
      - name: Checkout qualification tool from this workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: selfhost6-qualification-tools
          sparse-checkout: scripts/selfhost6/platform-sqlite-swap.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: selfhost6-static-${{ inputs.target-version }}
          path: static
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install packaged runtime dependencies
        working-directory: static
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Build macOS candidate
        if: matrix.platform == 'darwin'
        working-directory: static
        run: ${{ matrix.arch == 'arm64' && 'pnpm electron:make-unsigned --mac dmg zip --arm64' || 'pnpm electron:make-unsigned --mac dmg zip --x64' }}
        env:
          SELFHOST6_SOURCE_FULL_SHA: ${{ inputs.source-full-sha }}
          SELFHOST6_TARGET_VERSION: ${{ inputs.target-version }}
          SELFHOST6_TARGET_PLATFORM: ${{ matrix.platform }}
          SELFHOST6_TARGET_ARCH: ${{ matrix.arch }}
      - name: Verify packaged macOS main-process dependencies
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          app_path="$(find "${GITHUB_WORKSPACE}/static/dist" -maxdepth 2 -type d -name 'Logseq.app' -print -quit)"
          test -n "$app_path"
          ELECTRON_RUN_AS_NODE=1 "$app_path/Contents/MacOS/Logseq" \
            -e 'require(process.argv[1] + "/node_modules/electron-log"); console.log("packaged-runtime-ok")' \
            "$app_path/Contents/Resources/app.asar"
      - name: Build Linux candidate
        if: matrix.platform == 'linux'
        working-directory: static
        run: ${{ matrix.arch == 'arm64' && 'pnpm electron:make-linux-arm64' || 'pnpm electron:make' }}
        env:
          SELFHOST6_SOURCE_FULL_SHA: ${{ inputs.source-full-sha }}
          SELFHOST6_TARGET_VERSION: ${{ inputs.target-version }}
          SELFHOST6_TARGET_PLATFORM: ${{ matrix.platform }}
          SELFHOST6_TARGET_ARCH: ${{ matrix.arch }}
      - name: Build Windows candidate
        if: matrix.platform == 'win32'
        shell: pwsh
        working-directory: static
        run: pnpm electron:make-unsigned --win nsis zip --${{ matrix.arch }}
        env:
          SELFHOST6_SOURCE_FULL_SHA: ${{ inputs.source-full-sha }}
          SELFHOST6_TARGET_VERSION: ${{ inputs.target-version }}
          SELFHOST6_TARGET_PLATFORM: ${{ matrix.platform }}
          SELFHOST6_TARGET_ARCH: ${{ matrix.arch }}
      - name: Normalize Unix updater input
        if: matrix.platform != 'win32'
        shell: bash
        run: |
          mkdir -p candidate-input
          cp static/updater/TARGET_BUILD_MANIFEST.json candidate-input/TARGET_BUILD_MANIFEST.json
          if [ "${{ matrix.platform }}" = darwin ]; then
            base="Logseq-darwin-${{ matrix.arch }}-${{ inputs.target-version }}"
            cp "$(find static/dist -maxdepth 1 -type f -name '*.zip' -print -quit)" "candidate-input/${base}.zip"
            cp "$(find static/dist -maxdepth 1 -type f -name '*.dmg' -print -quit)" "candidate-input/${base}.dmg"
          else
            linux_arch="${{ matrix.arch }}"
            if [ "$linux_arch" = x64 ]; then linux_arch=x86_64; fi
            base="Logseq-linux-${linux_arch}-${{ inputs.target-version }}"
            cp "$(find static/dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)" "candidate-input/${base}.AppImage"
          fi
      - name: Normalize Windows updater input
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          New-Item -ItemType Directory candidate-input
          Copy-Item static/updater/TARGET_BUILD_MANIFEST.json candidate-input/TARGET_BUILD_MANIFEST.json
          $base = "Logseq-win-${{ matrix.arch }}-${{ inputs.target-version }}"
          Copy-Item (Get-ChildItem static/dist/*-nsis.exe | Select-Object -First 1) "candidate-input/${base}-nsis.exe"
      - name: Qualify native SQLite WAL swap boundary
        shell: bash
        run: |
          node selfhost6-qualification-tools/scripts/selfhost6/platform-sqlite-swap.mjs \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --source-full-sha "${{ inputs.source-full-sha }}" \
            --output candidate-input/PLATFORM_SQLITE_SWAP_RECEIPT.json
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost6-unsigned-${{ matrix.id }}-${{ inputs.target-version }}
          path: candidate-input

  sign-and-stage:
    needs: build-platform
    runs-on: ubuntu-22.04
    environment: selfhost-release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-full-sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: selfhost6-unsigned-*-${{ inputs.target-version }}
          path: unsigned
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Sign immutable artifact descriptors
        shell: bash
        env:
          LOGSEQ_PROJECT_UPDATE_SIGNING_KEY_PKCS8_BASE64: ${{ secrets.LOGSEQ_PROJECT_UPDATE_SIGNING_KEY_PKCS8_BASE64 }}
        run: |
          mkdir -p signed
          node scripts/selfhost6/prepare-update-artifact.mjs --archive unsigned/selfhost6-unsigned-darwin-x64-${{ inputs.target-version }}/Logseq-darwin-x64-${{ inputs.target-version }}.zip --target-manifest unsigned/selfhost6-unsigned-darwin-x64-${{ inputs.target-version }}/TARGET_BUILD_MANIFEST.json --source-full-sha "${{ inputs.source-full-sha }}" --target-version "${{ inputs.target-version }}" --platform darwin --arch x64 --output-directory signed
          node scripts/selfhost6/prepare-update-artifact.mjs --archive unsigned/selfhost6-unsigned-darwin-arm64-${{ inputs.target-version }}/Logseq-darwin-arm64-${{ inputs.target-version }}.zip --target-manifest unsigned/selfhost6-unsigned-darwin-arm64-${{ inputs.target-version }}/TARGET_BUILD_MANIFEST.json --source-full-sha "${{ inputs.source-full-sha }}" --target-version "${{ inputs.target-version }}" --platform darwin --arch arm64 --output-directory signed
          node scripts/selfhost6/prepare-update-artifact.mjs --archive unsigned/selfhost6-unsigned-darwin-x64-${{ inputs.target-version }}/Logseq-darwin-x64-${{ inputs.target-version }}.dmg --target-manifest unsigned/selfhost6-unsigned-darwin-x64-${{ inputs.target-version }}/TARGET_BUILD_MANIFEST.json --source-full-sha "${{ inputs.source-full-sha }}" --target-version "${{ inputs.target-version }}" --platform darwin --arch x64 --output-directory signed
          node scripts/selfhost6/prepare-update-artifact.mjs --archive unsigned/selfhost6-unsigned-darwin-arm64-${{ inputs.target-version }}/Logseq-darwin-arm64-${{ inputs.target-version }}.dmg --target-manifest unsigned/selfhost6-unsigned-darwin-arm64-${{ inputs.target-version }}/TARGET_BUILD_MANIFEST.json --source-full-sha "${{ inputs.source-full-sha }}" --target-version "${{ inputs.target-version }}" --platform darwin --arch arm64 --output-directory signed
          node scripts/selfhost6/prepare-update-artifact.mjs --archive unsigned/selfhost6-unsigned-win32-x64-${{ inputs.target-version }}/Logseq-win-x64-${{ inputs.target-version }}-nsis.exe --target-manifest unsigned/selfhost6-unsigned-win32-x64-${{ inputs.target-version }}/TARGET_BUILD_MANIFEST.json --source-full-sha "${{ inputs.source-full-sha }}" --target-version "${{ inputs.target-version }}" --platform win32 --arch x64 --output-directory signed
          node scripts/selfhost6/prepare-update-artifact.mjs --archive unsigned/selfhost6-unsigned-win32-arm64-${{ inputs.target-version }}/Logseq-win-arm64-${{ inputs.target-version }}-nsis.exe --target-manifest unsigned/selfhost6-unsigned-win32-arm64-${{ inputs.target-version }}/TARGET_BUILD_MANIFEST.json --source-full-sha "${{ inputs.source-full-sha }}" --target-version "${{ inputs.target-version }}" --platform win32 --arch arm64 --output-directory signed
          node scripts/selfhost6/prepare-update-artifact.mjs --archive unsigned/selfhost6-unsigned-linux-x64-${{ inputs.target-version }}/Logseq-linux-x86_64-${{ inputs.target-version }}.AppImage --target-manifest unsigned/selfhost6-unsigned-linux-x64-${{ inputs.target-version }}/TARGET_BUILD_MANIFEST.json --source-full-sha "${{ inputs.source-full-sha }}" --target-version "${{ inputs.target-version }}" --platform linux --arch x64 --output-directory signed
          node scripts/selfhost6/prepare-update-artifact.mjs --archive unsigned/selfhost6-unsigned-linux-arm64-${{ inputs.target-version }}/Logseq-linux-arm64-${{ inputs.target-version }}.AppImage --target-manifest unsigned/selfhost6-unsigned-linux-arm64-${{ inputs.target-version }}/TARGET_BUILD_MANIFEST.json --source-full-sha "${{ inputs.source-full-sha }}" --target-version "${{ inputs.target-version }}" --platform linux --arch arm64 --output-directory signed
      - name: Bind platform qualification receipts to the candidate artifact
        shell: bash
        run: |
          mkdir -p signed/qualification-receipts
          cp unsigned/selfhost6-unsigned-darwin-x64-${{ inputs.target-version }}/PLATFORM_SQLITE_SWAP_RECEIPT.json signed/qualification-receipts/darwin-x64.json
          cp unsigned/selfhost6-unsigned-darwin-arm64-${{ inputs.target-version }}/PLATFORM_SQLITE_SWAP_RECEIPT.json signed/qualification-receipts/darwin-arm64.json
          cp unsigned/selfhost6-unsigned-win32-x64-${{ inputs.target-version }}/PLATFORM_SQLITE_SWAP_RECEIPT.json signed/qualification-receipts/win32-x64.json
          cp unsigned/selfhost6-unsigned-win32-arm64-${{ inputs.target-version }}/PLATFORM_SQLITE_SWAP_RECEIPT.json signed/qualification-receipts/win32-arm64.json
          cp unsigned/selfhost6-unsigned-linux-x64-${{ inputs.target-version }}/PLATFORM_SQLITE_SWAP_RECEIPT.json signed/qualification-receipts/linux-x64.json
          cp unsigned/selfhost6-unsigned-linux-arm64-${{ inputs.target-version }}/PLATFORM_SQLITE_SWAP_RECEIPT.json signed/qualification-receipts/linux-arm64.json
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost6-signed-candidate-${{ inputs.target-version }}-${{ inputs.source-full-sha }}
          path: signed
          if-no-files-found: error
