# This is the main desktop application release workflow for both nightly and beta/stable releases.

name: Build-Desktop-Release
run-name: ${{ github.event_name == 'push' && format('Desktop release rehearsal · {0}', github.sha) || 'Build-Desktop-Release' }}

on:
  push:
    branches:
      - selfhost/cloudflare-rtc
  workflow_dispatch:
    inputs:
      build-target:
        description: 'Build Target (Release Type)'
        type: choice
        required: true
        options:
          - stable
          - beta
          - nightly
          - non-release
        default: "non-release"
      git-ref:
        description: "Release Git Ref (Which branch or tag to build?)"
        required: true
        default: "master"
      desktop-platforms:
        description: "Desktop platforms to build"
        type: choice
        required: true
        options:
          - all
          - windows-only
        default: "all"
      is-draft:
        description: 'Draft Release? (Beta only, Nightly will always be a non-draft)'
        type: boolean
        required: true
        default: true
      is-pre-release:
        description: 'Pre Release? (labeled as "PreRelease")'
        type: boolean
        required: true
        default: true
      enable-file-sync-production:
        description: 'File sync production mode'
        type: boolean
        required: true
        default: true
      enable-plugins:
        description: 'Build with plugin system support'
        type: boolean
        required: true
        default: true
      build-android:
        description: 'Build Android App'
        type: boolean
        required: true
        default: false
      publish-linux-stores:
        description: 'Publish Flathub and Snap'
        type: boolean
        required: true
        default: false
  # schedule: # Every workday at the 2 P.M. (UTC) we run a scheduled nightly build
  #   - cron: '0 14 * * MON-FRI'

env:
  CLOJURE_VERSION: '1.12.4.1618'
  NODE_VERSION: '24'
  JAVA_VERSION: '21'
  BABASHKA_VERSION: '1.12.215'
  OCAML_VERSION: '5.4.0'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  source-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref || github.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}
          bb: ${{ env.BABASHKA_VERSION }}

      - name: Run deterministic release preflight
        run: pnpm desktop:release-preflight:quick -- --strict

  release-rehearsal-gate:
    needs: [ source-preflight ]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out requested release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref || github.sha }}
          persist-credentials: false

      - name: Resolve requested commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify successful push rehearsal
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build-target == 'beta' || github.event.inputs.build-target == 'stable') }}
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.source.outputs.sha }}';
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-desktop-release.yml',
              event: 'push',
              status: 'success',
              head_sha: sha,
              per_page: 10,
            });
            if (response.data.workflow_runs.length === 0) {
              core.setFailed(
                `No successful six-platform push rehearsal exists for ${sha}. ` +
                `Push this exact commit and wait for Build-Desktop-Release to pass before publishing.`,
              );
            }

  rtc-release-gate:
    needs: [ source-preflight, release-rehearsal-gate ]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref || github.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install db-sync dependencies
        run: pnpm --dir deps/db-sync install --frozen-lockfile

      - name: Compile client tests
        run: pnpm cljs:test

      - name: Install desktop test dependencies
        run: |
          cp resources/package.json resources/pnpm-lock.yaml static/
          pnpm --dir static install --frozen-lockfile --ignore-workspace

      - name: Run RTC client and Electron tests
        run: |
          LOGSEQ_STABLE_IDENTS=1 node static/tests.js \
            -r '^(electron\.(db-worker-manager|power-monitor|proxy|updater-config)-test|frontend\.handler\.db-based\.(rtc-background-tasks|sync)-test|frontend\.worker\.(db-core|db-sync|db-sync-sim|db-worker|pipeline|platform-node|state)-test|frontend\.worker\.sync\..*-test|logseq\.cli\.command\.sync-test|logseq\.db-worker\.daemon-test)$' \
            -e fix-me

      - name: Run db-sync server tests
        run: pnpm --dir deps/db-sync test

      - name: Build db-sync production Worker
        run: pnpm --dir deps/db-sync release

      - name: Build db-sync API documentation asset
        run: pnpm --dir deps/db-sync build:api-docs

      - name: Validate db-sync Worker bundle
        working-directory: deps/db-sync/worker
        run: pnpm exec wrangler deploy --dry-run --env=""

      - name: Run db-sync 128 MB memory test
        run: pnpm --dir deps/db-sync test:large-op-128m

      - name: Run client snapshot backup 128 MB memory test
        run: |
          clojure -M:test release db-sync-backup-memory-test
          node --expose-gc --max-old-space-size=128 \
            static/db-sync-backup-memory-test.js

  rtc-browser-e2e:
    uses: ./.github/workflows/clj-rtc-e2e.yml
    with:
      source-ref: ${{ github.event.inputs.git-ref || github.sha }}

  compile-cljs:
    needs: [ rtc-release-gate, rtc-browser-e2e ]
    runs-on: ubuntu-22.04
    steps:
      - name: Check build options
        if: ${{ github.repository == 'logseq/logseq' && github.event_name == 'workflow_dispatch' && (github.event.inputs.build-target == 'nightly' || github.event.inputs.build-target == 'beta' || github.event.inputs.build-target == 'stable') && github.event.inputs.git-ref != 'master' }}
        run: |
          echo "::error title=CheckFail::Nightly, Beta and Stable Release MUST be built from master"
          exit 1

      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref || github.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Get pnpm store directory path
        id: pnpm-store-dir-path
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store directory
        uses: actions/cache@v4
        id: pnpm-cache
        with:
          path: ${{ steps.pnpm-store-dir-path.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-lib-${{ hashFiles('**/deps.edn') }}

      - name: Setup clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Fetch OCaml deps
        working-directory: cli
        run: opam install . --deps-only --with-test --yes

      - name: Fetch CLI pnpm deps
        run: pnpm --dir cli install --frozen-lockfile --ignore-workspace

      - name: Retrieve tag version
        id: ref
        run: |
          pkgver=$(node ./scripts/get-pkg-version.js "${{ github.event.inputs.build-target }}")
          echo "version=$pkgver" >> $GITHUB_OUTPUT

      - name: Do Not Overwrite Existing Release
        if: ${{ github.event.inputs.build-target == 'beta' || github.event.inputs.build-target == 'stable' }}
        run: |
          if curl -f "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.ref.outputs.version }}" &>/dev/null; then
            echo "::error title=CheckFail::Release already exists"
            exit 1
          fi

      - name: Update Nightly APP Version
        if: ${{ github.event.inputs.build-target == 'nightly' || github.event_name == 'schedule' }}
        run: |
          sed -i 's/defonce version ".*"/defonce version "${{ steps.ref.outputs.version }}"/g' src/main/frontend/version.cljs

      - name: Set build environment variables
        run: |
          echo "ENABLE_PLUGINS=${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event.inputs.enable-plugins == 'true' }}" >> $GITHUB_ENV
          echo "ENABLE_FILE_SYNC_PRODUCTION=${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event.inputs.enable-file-sync-production == 'true' }}" >> $GITHUB_ENV

      - name: Compile CLJS
        run: |
          pnpm install --frozen-lockfile
          gulp build
          pnpm cljs:release-electron
          pnpm db-worker-node:bundle
          opam exec -- pnpm cli:release
          pnpm webpack-app-build
          pnpm desktop:prepare-runtime-js
          pnpm desktop:verify-runtime-revisions
        env:
          LOGSEQ_SENTRY_DSN: ${{ secrets.LOGSEQ_SENTRY_DSN }}
          LOGSEQ_POSTHOG_TOKEN: ${{ secrets.LOGSEQ_POSTHOG_TOKEN }}

      - name: Verify bundled db-worker-node runtime
        run: |
          test -f ./dist/db-worker-node.js
          test -f ./dist/db-worker-node-assets.json

      - name: Verify bundled CLI
        run: |
          test -f ./static/js/logseq-cli.js
          node ./static/js/logseq-cli.js --help >/tmp/logseq-cli-help.txt
          grep -E "USAGE|Usage|COMMANDS|Commands" /tmp/logseq-cli-help.txt >/dev/null

      - name: Verify desktop runtime script locations
        run: |
          test -f ./static/js/db-worker-node.js
          test -f ./static/js/logseq-cli.js
          test -f ./static/.agents/skills/logseq-cli/SKILL.md
          pnpm desktop:verify-runtime-revisions

      - name: Verify release configuration
        run: node scripts/test-cli-release-config.mjs

      - name: Update APP Version
        run: pnpm pkg set version="${{ steps.ref.outputs.version }}"
        working-directory: ./static

      - name: Display Package.json
        run: cat ./package.json
        working-directory: ./static

      - name: Save VERSION file
        run: echo "${{ steps.ref.outputs.version }}" > ./VERSION
        working-directory: ./static

      - name: List Files
        run: ls -al
        working-directory: ./static

      - name: Upload Sentry Sourcemaps (beta only)
        if: ${{ github.repository == 'logseq/logseq' }}
        # if: ${{ github.repository == 'logseq/logseq' && github.event_name == 'workflow_dispatch' && github.event.inputs.build-target == 'beta' }}
        run: |
          curl -sL https://sentry.io/get-cli/ | SENTRY_CLI_VERSION=2.58.4 bash
          release_name="logseq@${{ steps.ref.outputs.version }}"
          sentry-cli releases new "${release_name}"
          sentry-cli releases files "${release_name}" upload-sourcemaps --ext map --ext js ./static/js --url-prefix '~/static/js'
          sentry-cli releases finalize "${release_name}"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: logseq
          SENTRY_PROJECT: logseq

      - name: Cache Static File
        uses: actions/upload-artifact@v4
        with:
          name: static
          path: static
          include-hidden-files: true

  build-linux-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.desktop-platforms != 'windows-only' }}
    runs-on: ubuntu-22.04
    needs: [ compile-cljs ]
    steps:
      - name: Download The Static Asset
        uses: actions/download-artifact@v4
        with:
          name: static
          path: static

      - name: Retrieve tag version
        id: ref
        run: |
          pkgver=$(cat ./static/VERSION)
          echo "version=$pkgver" >> $GITHUB_OUTPUT

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      # - name: Cache Node Modules
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       **/node_modules
      #     key: ${{ runner.os }}-node-modules

      - name: Build/Release Electron App
        run: pnpm install --frozen-lockfile && pnpm electron:verify-updater-provider && pnpm electron:make
        working-directory: ./static

      - name: Verify packaged desktop
        run: pnpm electron:verify-package -- --search-root dist --platform linux --arch x64 --version "${{ steps.ref.outputs.version }}"
        working-directory: ./static

      - name: Save artifacts
        run: |
          mkdir -p builds
          # NOTE: save VERSION file to builds directory
          cp static/VERSION               ./builds/VERSION
          mv static/dist/*.AppImage       ./builds/
          shopt -s nullglob
          blockmaps=(static/dist/*.blockmap)
          if [ ${#blockmaps[@]} -gt 0 ]; then
            mv static/dist/*.blockmap     ./builds/
          fi
          mv static/dist/latest-linux.yml ./builds/latest-linux.yml
          mv static/dist/*.zip            ./builds/Logseq-linux-x86_64-${{ steps.ref.outputs.version }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: logseq-linux-x64-builds
          path: builds

  build-linux-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.desktop-platforms != 'windows-only' }}
    runs-on: ubuntu-22.04
    needs: [ compile-cljs ]
    steps:
      - name: Download The Static Asset
        uses: actions/download-artifact@v4
        with:
          name: static
          path: static

      - name: Retrieve tag version
        id: ref
        run: |
          pkgver=$(cat ./static/VERSION)
          echo "version=$pkgver" >> $GITHUB_OUTPUT

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Fetch deps
        env:
          npm_config_arch: arm64
          npm_config_target_platform: linux
        run: |
          pnpm install --frozen-lockfile
        working-directory: ./static

      - name: Build/Release Electron App
        run: pnpm electron:verify-updater-provider && pnpm electron:make-linux-arm64
        working-directory: ./static

      - name: Verify packaged desktop
        run: pnpm electron:verify-package -- --search-root dist --platform linux --arch arm64 --version "${{ steps.ref.outputs.version }}"
        working-directory: ./static

      - name: Save artifacts
        run: |
          mkdir -p builds
          # NOTE: save VERSION file to builds directory
          cp static/VERSION                     ./builds/VERSION
          mv static/dist/*.AppImage             ./builds/Logseq-linux-arm64-${{ steps.ref.outputs.version }}.AppImage
          shopt -s nullglob
          blockmaps=(static/dist/*.blockmap)
          if [ ${#blockmaps[@]} -gt 0 ]; then
            mv static/dist/*.blockmap           ./builds/
          fi
          mv static/dist/latest-linux-arm64.yml ./builds/latest-linux-arm64.yml
          mv static/dist/*.zip                  ./builds/Logseq-linux-arm64-${{ steps.ref.outputs.version }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: logseq-linux-arm64-builds
          path: builds

  build-windows-x64:
    runs-on: windows-latest
    needs: [ compile-cljs ]
    steps:
      - name: Download The Static Asset
        uses: actions/download-artifact@v4
        with:
          name: static
          path: static

      - name: Retrieve tag version
        id: ref
        run: echo "version=$(cat ./static/VERSION)" >> $env:GITHUB_OUTPUT

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      # - name: Cache Node Modules
      #   uses: actions/cache@v4
      #   with:
      #    path: |
      #      **/node_modules
      #    key: ${{ runner.os }}-node-modules

      - name: Deps Electron app
        run: pnpm install --frozen-lockfile
        working-directory: ./static

      - name: Verify updater provider contract
        run: pnpm electron:verify-updater-provider
        working-directory: ./static

      - name: Build/Release signed Electron app
        if: ${{ github.repository == 'logseq/logseq' }}
        shell: pwsh
        run: |
          $signCfg = @'
          {
            "extends": "./electron-builder.yml",
            "win": {
              "azureSignOptions": {
                "publisherName": "Logseq, Inc.",
                "endpoint": "https://eus.codesigning.azure.net/",
                "certificateProfileName": "Logseq",
                "codeSigningAccountName": "logseqwin"
              }
            }
          }
          '@
          $signCfgPath = Join-Path $PWD "electron-builder.sign-win.json"
          $signCfg | Out-File -FilePath $signCfgPath -Encoding utf8NoBOM
          pnpm exec electron-builder --config $signCfgPath --publish never
        working-directory: ./static
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build/Release unsigned Electron app for forks
        if: ${{ github.repository != 'logseq/logseq' }}
        run: pnpm exec electron-builder --publish never
        working-directory: ./static

      - name: Verify packaged desktop
        run: pnpm electron:verify-package -- --search-root dist --platform win32 --arch x64 --version "${{ steps.ref.outputs.version }}"
        working-directory: ./static

      - name: Save Artifact
        run: |
          mkdir builds
          mv static\dist\*-nsis.exe   builds\Logseq-win-x64-${{ steps.ref.outputs.version }}-nsis.exe
          mv static\dist\*.blockmap   builds\
          mv static\dist\latest.yml   builds\latest-x64.yml
          mv static\dist\*.zip        builds\Logseq-win-x64-${{ steps.ref.outputs.version }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: logseq-win-x64-builds
          path: builds

  build-windows-arm64:
    runs-on: windows-latest
    needs: [ compile-cljs ]
    steps:
      - name: Download The Static Asset
        uses: actions/download-artifact@v4
        with:
          name: static
          path: static

      - name: Retrieve tag version
        id: ref
        run: echo "version=$(cat ./static/VERSION)" >> $env:GITHUB_OUTPUT

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      # - name: Cache Node Modules
      #   uses: actions/cache@v4
      #   with:
      #    path: |
      #      **/node_modules
      #    key: ${{ runner.os }}-node-modules

      - name: Deps Electron app
        run: pnpm install --frozen-lockfile
        working-directory: ./static

      - name: Verify updater provider contract
        run: pnpm electron:verify-updater-provider
        working-directory: ./static

      - name: Build/Release signed Electron app
        if: ${{ github.repository == 'logseq/logseq' }}
        shell: pwsh
        run: |
          $signCfg = @'
          {
            "extends": "./electron-builder.yml",
            "win": {
              "azureSignOptions": {
                "publisherName": "Logseq, Inc.",
                "endpoint": "https://eus.codesigning.azure.net/",
                "certificateProfileName": "Logseq",
                "codeSigningAccountName": "logseqwin"
              }
            }
          }
          '@
          $signCfgPath = Join-Path $PWD "electron-builder.sign-win.json"
          $signCfg | Out-File -FilePath $signCfgPath -Encoding utf8NoBOM
          pnpm exec electron-builder --config $signCfgPath --win nsis zip --arm64 --publish never
        working-directory: ./static
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build/Release unsigned Electron app for forks
        if: ${{ github.repository != 'logseq/logseq' }}
        run: pnpm exec electron-builder --win nsis zip --arm64 --publish never
        working-directory: ./static

      - name: Verify packaged desktop
        run: pnpm electron:verify-package -- --search-root dist --platform win32 --arch arm64 --version "${{ steps.ref.outputs.version }}"
        working-directory: ./static

      - name: Save Artifact
        run: |
          mkdir builds
          mv static\dist\*-nsis.exe   builds\Logseq-win-arm64-${{ steps.ref.outputs.version }}-nsis.exe
          mv static\dist\*.blockmap   builds\
          mv static\dist\latest.yml   builds\latest-arm64.yml
          mv static\dist\*.zip        builds\Logseq-win-arm64-${{ steps.ref.outputs.version }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: logseq-win-arm64-builds
          path: builds

  build-macos-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.desktop-platforms != 'windows-only' }}
    needs: [ compile-cljs ]
    runs-on: macos-15-intel
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATES_P12 != '' }}
    steps:
      - name: Download The Static Asset
        uses: actions/download-artifact@v4
        with:
          name: static
          path: static

      - name: Retrieve tag version
        id: ref
        run: |
          pkgver=$(cat ./static/VERSION)
          echo "version=$pkgver" >> $GITHUB_OUTPUT

      - name: List Static Files
        run: ls -al ./static

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Get pnpm store directory path
        id: pnpm-store-dir-path
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Cache pnpm store directory
        uses: actions/cache@v4
        id: pnpm-cache
        with:
          path: ${{ steps.pnpm-store-dir-path.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Signing By Apple Developer ID
        if: ${{ env.HAS_APPLE_SIGNING == 'true' }}
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATES_P12_PASSWORD }}

      - name: Require Developer ID for published macOS releases
        if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build-target != 'non-release')) && env.HAS_APPLE_SIGNING != 'true' }}
        run: |
          echo "::error title=Missing Developer ID::Published macOS releases must be Developer ID signed and notarized. Ad-hoc builds are rehearsal artifacts only."
          exit 1

      # - name: Cache Node Modules
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       **/node_modules
      #     key: ${{ runner.os }}-node-modules

      - name: Build/Release Electron App for x64
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm rebuild:all
          pnpm electron:verify-updater-provider
          if [ "${HAS_APPLE_SIGNING}" = "true" ]; then
            pnpm electron:make
          else
            pnpm electron:make-unsigned --mac dmg zip --x64
          fi
        working-directory: ./static
        env:
          APPLE_ID: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify packaged desktop
        run: pnpm electron:verify-package -- --search-root dist --platform darwin --arch x64 --version "${{ steps.ref.outputs.version }}"
        working-directory: ./static

      - name: Verify fork macOS app can load Electron
        if: ${{ env.HAS_APPLE_SIGNING != 'true' }}
        run: |
          app_path="$(find static/dist -type d -name 'Logseq.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          expected="$(node -p "require('./static/package.json').devDependencies.electron")"
          actual="$(ELECTRON_RUN_AS_NODE=1 "$app_path/Contents/MacOS/Logseq" -e 'process.stdout.write(process.versions.electron)')"
          test "$actual" = "$expected"

      - name: Verify Developer ID signature and notarization
        if: ${{ env.HAS_APPLE_SIGNING == 'true' }}
        run: |
          app_path="$(find static/dist -type d -name 'Logseq.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Save x64 artifacts
        run: |
          mkdir -p builds
          cp static/VERSION              ./builds/VERSION
          mv static/dist/*.dmg           ./builds/Logseq-darwin-x64-${{ steps.ref.outputs.version }}.dmg
          mv static/dist/*.zip           ./builds/Logseq-darwin-x64-${{ steps.ref.outputs.version }}.zip
          mv static/dist/*.blockmap      ./builds/
          metadata_name="$(node static/selfhost-updater-version.mjs macos-metadata-name "${{ steps.ref.outputs.version }}" x64)"
          mv static/dist/latest-mac.yml  "./builds/${metadata_name}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: logseq-darwin-x64-builds
          path: builds

  build-macos-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.desktop-platforms != 'windows-only' }}
    needs: [ compile-cljs ]
    runs-on: macos-14
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATES_P12 != '' }}
    steps:
      - name: Download The Static Asset
        uses: actions/download-artifact@v4
        with:
          name: static
          path: static

      - name: Check out macOS updater signature gate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref || github.sha }}
          path: release-gate-source
          persist-credentials: false

      - name: Retrieve tag version
        id: ref
        run: |
          pkgver=$(cat ./static/VERSION)
          echo "version=$pkgver" >> $GITHUB_OUTPUT

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Get pnpm store directory path
        id: pnpm-store-dir-path
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Cache pnpm store directory
        uses: actions/cache@v4
        id: pnpm-cache
        with:
          path: ${{ steps.pnpm-store-dir-path.outputs.dir }}
          key: ${{ runner.os }}-arm64-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-arm64-pnpm-

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Signing By Apple Developer ID
        if: ${{ env.HAS_APPLE_SIGNING == 'true' }}
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATES_P12_PASSWORD }}

      - name: Require Developer ID for published macOS releases
        if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build-target != 'non-release')) && env.HAS_APPLE_SIGNING != 'true' }}
        run: |
          echo "::error title=Missing Developer ID::Published macOS releases must be Developer ID signed and notarized. Ad-hoc builds are rehearsal artifacts only."
          exit 1

      # - name: Cache Node Modules
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       **/node_modules
      #     key: ${{ runner.os }}-node-modules

      - name: Fetch deps
        run: pnpm install --frozen-lockfile --ignore-workspace --config.supportedArchitectures.os=darwin --config.supportedArchitectures.cpu=arm64 && pnpm rebuild:all && pnpm electron:verify-updater-provider
        working-directory: ./static

      - name: Build/Release Electron App for arm64
        run: |
          if [ "${HAS_APPLE_SIGNING}" = "true" ]; then
            pnpm electron:make-macos-arm64
          else
            pnpm electron:make-unsigned --mac dmg zip --arm64
          fi
        working-directory: ./static
        env:
          APPLE_ID: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify packaged desktop
        run: pnpm electron:verify-package -- --search-root dist --platform darwin --arch arm64 --version "${{ steps.ref.outputs.version }}"
        working-directory: ./static

      - name: Verify macOS updater installation compatibility
        run: |
          candidate_zip="$(find static/dist -maxdepth 1 -type f -name 'Logseq-darwin-arm64-*.zip' -print -quit)"
          test -n "$candidate_zip"
          node release-gate-source/scripts/verify-macos-updater-signature.mjs \
            --arch arm64 \
            --candidate-version "${{ steps.ref.outputs.version }}" \
            --candidate-metadata static/dist/latest-mac.yml \
            --candidate-zip "$candidate_zip"

      - name: Verify fork macOS app can load Electron
        if: ${{ env.HAS_APPLE_SIGNING != 'true' }}
        run: |
          app_path="$(find static/dist -type d -name 'Logseq.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          expected="$(node -p "require('./static/package.json').devDependencies.electron")"
          actual="$(ELECTRON_RUN_AS_NODE=1 "$app_path/Contents/MacOS/Logseq" -e 'process.stdout.write(process.versions.electron)')"
          test "$actual" = "$expected"

      - name: Verify Developer ID signature and notarization
        if: ${{ env.HAS_APPLE_SIGNING == 'true' }}
        run: |
          app_path="$(find static/dist -type d -name 'Logseq.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Save arm64 artifacts
        run: |
          mkdir -p builds
          cp static/VERSION              ./builds/VERSION
          mv static/dist/*.dmg           ./builds/Logseq-darwin-arm64-${{ steps.ref.outputs.version }}.dmg
          mv static/dist/*.zip           ./builds/Logseq-darwin-arm64-${{ steps.ref.outputs.version }}.zip
          mv static/dist/*.blockmap      ./builds/
          metadata_name="$(node static/selfhost-updater-version.mjs macos-metadata-name "${{ steps.ref.outputs.version }}" arm64)"
          mv static/dist/latest-mac.yml  "./builds/${metadata_name}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: logseq-darwin-arm64-builds
          path: builds

  # reuse workflow via workflow_call
  build-android:
    uses: ./.github/workflows/build-android.yml
    if: ${{ github.event_name == 'schedule' || github.event.inputs.build-android == 'true' }}
    with:
      build-target: "${{ github.event.inputs.build-target }}"
      # if scheduled, use production mode
      enable-file-sync-production: "${{ github.event_name == 'schedule' || github.event.inputs.enable-file-sync-production == 'true' }}"
    secrets:
      ANDROID_KEYSTORE: "${{ secrets.ANDROID_KEYSTORE }}"
      ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
      SENTRY_AUTH_TOKEN: "${{ secrets.SENTRY_AUTH_TOKEN }}"

  release-assets-preflight:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event.inputs.desktop-platforms != 'windows-only' }}
    needs: [ build-macos-x64, build-macos-arm64, build-linux-x64, build-linux-arm64, build-windows-x64, build-windows-arm64 ]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out release verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref || github.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: logseq-*-builds
          path: ${{ runner.temp }}/desktop-release-assets
          merge-multiple: true

      - name: Verify complete desktop release asset set
        run: |
          version="$(cat "${RUNNER_TEMP}/desktop-release-assets/VERSION")"
          node scripts/verify-desktop-release-assets.mjs \
            --dir "${RUNNER_TEMP}/desktop-release-assets" \
            --version "$version" \
            --write-checksums
          cat "${RUNNER_TEMP}/desktop-release-assets/SHA256SUMS.txt"

  nightly-release:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.build-target == 'nightly' }}
    needs: [ release-assets-preflight ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out release verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref || github.sha }}
          persist-credentials: false

      - name: Download MacOS x64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: logseq-darwin-x64-builds
          path: ./

      - name: Download MacOS arm64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: logseq-darwin-arm64-builds
          path: ./

      - name: Download The Linux x64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: logseq-linux-x64-builds
          path: ./

      - name: Download The Linux arm64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: logseq-linux-arm64-builds
          path: ./

      - name: Download The Windows Artifact x64
        uses: actions/download-artifact@v4
        with:
          name: logseq-win-x64-builds
          path: ./

      - name: Download The Windows Artifact arm64
        uses: actions/download-artifact@v4
        with:
          name: logseq-win-arm64-builds
          path: ./

      - name: Download Android Artifacts
        if: ${{ github.event_name == 'schedule' || github.event.inputs.build-android == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: logseq-android-builds
          path: ./

      - name: Verify desktop release assets
        run: |
          node scripts/verify-desktop-release-assets.mjs \
            --dir . \
            --version "$(cat VERSION)" \
            --write-checksums
          cat SHA256SUMS.txt

      - name: List files
        run: ls -rl

      - name: Update Nightly Release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26 # main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: 'Desktop app Nightly Release $$'
          draft: false
          prerelease: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.is-pre-release) || (github.event_name == 'schedule')}}
          body: |
            This is a nightly release of the Logseq desktop app.
            It's unstable compared to the official releases, **use it with caution**!
          files: |
            ./SHA256SUMS.txt
            ./*.zip
            ./*.dmg
            ./*.exe
            ./*.yml
            ./*.blockmap
            ./*.AppImage
            ./*.apk

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build-target == 'beta' || github.event.inputs.build-target == 'stable') }}
    needs: [ release-assets-preflight ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ref.outputs.version }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref || github.sha }}
          persist-credentials: false

      - name: Download MacOS x64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: logseq-darwin-x64-builds
          path: ./

      - name: Download MacOS arm64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: logseq-darwin-arm64-builds
          path: ./

      - name: Download The Linux x64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: logseq-linux-x64-builds
          path: ./

      - name: Download The Linux arm64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: logseq-linux-arm64-builds
          path: ./

      - name: Download The Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: logseq-win-x64-builds
          path: ./

      - name: Download The Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: logseq-win-arm64-builds
          path: ./

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        if: ${{ github.event_name == 'schedule' || github.event.inputs.build-android == 'true' }}
        with:
          name: logseq-android-builds
          path: ./

      - name: List files
        run: ls -rl

      - name: Retrieve tag version
        id: ref
        run: |
          pkgver=$(cat VERSION)
          echo "version=$pkgver" >> $GITHUB_OUTPUT

      - name: Verify desktop release assets
        run: |
          node scripts/verify-desktop-release-assets.mjs \
            --dir . \
            --version "${{ steps.ref.outputs.version }}" \
            --write-checksums \
            --require-release-notes \
            --release-notes-root .
          cat SHA256SUMS.txt

      - name: Create Release Draft
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.ref.outputs.version }}
          name: ${{ github.event.inputs.build-target == 'beta' && format('Desktop APP {0} (Beta Testing)', steps.ref.outputs.version) || format('Desktop APP {0}', steps.ref.outputs.version) }}
          body_path: docs/releases/${{ steps.ref.outputs.version }}.md
          draft: ${{ github.event.inputs.is-draft }}
          prerelease: ${{ !contains(steps.ref.outputs.version, '-selfhost.') && github.event.inputs.is-pre-release }}
          files: |
            ./VERSION
            ./SHA256SUMS.txt
            ./*.zip
            ./*.dmg
            ./*.exe
            ./*.yml
            ./*.blockmap
            ./*.AppImage
            ./*.apk

  trigger-flathub-release:
    runs-on: ubuntu-22.04
    needs: [ release ]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish-linux-stores == 'true' && (github.event.inputs.build-target == 'beta' || github.event.inputs.build-target == 'stable') }}
    steps:
      - name: Trigger Flathub release
        run: |
          if [ -z "${FLATHUB_WORKFLOW_TOKEN:-}" ]; then
            echo "::error title=CheckFail::FLATHUB_WORKFLOW_TOKEN is required to trigger Flathub release"
            exit 1
          fi

          if [ "${BUILD_TARGET}" = "stable" ]; then
            flathub_ref=master
          else
            flathub_ref=beta
          fi

          payload=$(jq -n \
            --arg ref "$flathub_ref" \
            --arg version "$VERSION" \
            '{ref: $ref, inputs: {force: true, version: $version}}')

          response=$(mktemp)
          status=$(curl -sS -o "$response" -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${FLATHUB_WORKFLOW_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/flathub/com.logseq.Logseq/actions/workflows/update.yml/dispatches \
            -d "$payload") || status=000

          echo "Flathub dispatch returned HTTP ${status}"
          if [ -s "$response" ]; then
            cat "$response"
          fi

          if [ "$status" != "204" ]; then
            echo "::error title=FlathubDispatchFailed::Failed to trigger Flathub release workflow"
            exit 1
          fi
        env:
          BUILD_TARGET: ${{ github.event.inputs.build-target }}
          VERSION: ${{ needs.release.outputs.version }}
          FLATHUB_WORKFLOW_TOKEN: ${{ secrets.FLATHUB_WORKFLOW_TOKEN }}

  publish-linux-snap:
    runs-on: ubuntu-22.04
    needs: [ release ]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish-linux-stores == 'true' && (github.event.inputs.build-target == 'beta' || github.event.inputs.build-target == 'stable') }}
    steps:
      - name: Download The Static Asset
        uses: actions/download-artifact@v4
        with:
          name: static
          path: static

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Publish Snap
        run: |
          if [ -z "${SNAPCRAFT_STORE_CREDENTIALS:-}" ]; then
            echo "::error title=CheckFail::SNAPCRAFT_STORE_CREDENTIALS is required to publish snap"
            exit 1
          fi

          if [ "${BUILD_TARGET}" = "stable" ]; then
            snap_grade=stable
            snap_channel=stable
          else
            snap_grade=devel
            snap_channel=beta
          fi

          printf '%s\n' \
            'extends: ./electron-builder.yml' \
            'snap:' \
            "  grade: ${snap_grade}" \
            '  publish:' \
            '    provider: snapStore' \
            '    channels:' \
            "      - ${snap_channel}" \
            > electron-builder.snap.yml

          pnpm install --frozen-lockfile
          pnpm electron:publish-snap -- --config electron-builder.snap.yml
        working-directory: ./static
        env:
          BUILD_TARGET: ${{ github.event.inputs.build-target }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
