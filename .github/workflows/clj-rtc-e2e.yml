name: Clojure RTC E2E

on:
  workflow_call:
    inputs:
      source-ref:
        description: "Exact source ref tested by a calling release workflow"
        required: false
        type: string
        default: ""
  workflow_dispatch:
  push:
    # selfhost/cloudflare-rtc is exercised through Build-Desktop-Release so
    # one commit cannot start two competing copies of the same RTC suite.
    branches: [master]
    paths:
      - 'clj-e2e/**'
      - '.github/workflows/clj-rtc-e2e.yml'
      - src/**
      - deps/**
      - packages/**
  pull_request:
    branches: [master, selfhost/cloudflare-rtc]
    paths:
      - 'clj-e2e/**'
      - '.github/workflows/clj-rtc-e2e.yml'
      - src/**
      - deps/**
      - packages/**

env:
  CLOJURE_VERSION: '1.12.4.1618'
  JAVA_VERSION: '21'
  # This is the latest node version we can run.
  NODE_VERSION: '24'
  BABASHKA_VERSION: '1.12.215'

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}
          bb: ${{ env.BABASHKA_VERSION }}

      - name: Clojure cache
        uses: actions/cache@v4
        id: clojure-deps
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-deps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clojure-deps-

      - name: Fetch Clojure deps
        if: steps.clojure-deps.outputs.cache-hit != 'true'
        run: clojure -Srepro -A:cljs -P

      - name: Shadow-cljs cache
        uses: actions/cache@v4
        with:
          path: .shadow-cljs
          # ensure update cache every time
          key: ${{ runner.os }}-shadow-cljs-${{ github.sha }}
          # will match most recent upload
          restore-keys: |
            ${{ runner.os }}-shadow-cljs-

      - name: Fetch pnpm deps
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true

      # NOTE: require the app to be build with DEV-RELEASE flag
      - name: Prepare E2E test build
        run: |
          pnpm gulp:build && clojure -M:cljs release app db-worker --config-merge "{:closure-defines {frontend.config/DEV-RELEASE true}}" --debug && pnpm webpack-app-build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-build
          path: static/
          retention-days: 1

  test:
    name: Test RTC E2E
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}
          bb: ${{ env.BABASHKA_VERSION }}

      - name: Clojure cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-e2e-deps-v2-${{ hashFiles('deps.edn', 'clj-e2e/deps.edn') }}
          restore-keys: ${{ runner.os }}-clojure-e2e-deps-v2-

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: static-build
          path: static

      - name: Prepare public dir
        run: |
          rsync -avz --exclude node_modules --exclude android --exclude ios ./static/ ./public/
          ls -lR ./public

      - name: Fetch E2E Clojure deps
        working-directory: clj-e2e
        run: clojure -Srepro -P -M:test

      # Both shards use the fixture's default e2etest account. Keep their
      # execution order aligned with the local rtc:prepush gate so one shard
      # cannot mutate the account while the other is preparing its RTC graph.
      - name: Run RTC E2E part 1
        run: timeout 30m node scripts/run-rtc-e2e.mjs rtc-extra-test

      - name: Run RTC E2E part 2
        # A part 1 failure must not silently skip coverage for part 2. The job
        # still remains failed because neither step ignores its exit status.
        if: ${{ !cancelled() }}
        run: timeout 30m node scripts/run-rtc-e2e.mjs rtc-extra-part2-test

      - name: Collect screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-rtc
          path: clj-e2e/e2e-dump/*
          retention-days: 1
