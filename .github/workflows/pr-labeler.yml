name: PR Labeler
on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-labeler:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target receives a write-capable token, so keep the
      # third-party action pinned to the reviewed v3.1.0 commit.
      - uses: TimonVS/pr-labeler-action@bd0b592a410983316a454e3d48444608f028ec8e # v3.1.0
        with:
          # optional, .github/pr-labeler.yml is the default value
          configuration-path: .github/pr-labeler.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
